name: Deploy Bella Music iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Número de build de TestFlight (ej. 1, 2, 3... - dejar vacío para auto)'
        required: false
        default: ''
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure iOS Platform Scaffolding
        run: |
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "⚡ Generando estructura nativa iOS con bundle ID com.bellamusic.app..."
            flutter create . --platforms=ios --org=com.bellamusic
          fi

      - name: Configure iOS Info.plist (Permissions & Name)
        run: |
          PLIST="ios/Runner/Info.plist"
          echo "Configurando Info.plist para Bella Music..."
          
          # Nombre comercial de la App
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Bella Music'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Bella Music'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 'Bella Music'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleName string 'Bella Music'" "$PLIST"
          
          # Audio en segundo plano (Background Audio)
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true
          
          # Permisos de red local para descubrimiento SSDP/DLNA (iOS 14+)
          /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription 'Bella Music necesita acceso a la red local para descubrir y reproducir música en tus altavoces Wi-Fi Linkplay.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Bella Music necesita acceso a la red local para descubrir y reproducir música en tus altavoces Wi-Fi Linkplay.'" "$PLIST"
          
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string '_http._tcp'" "$PLIST" 2>/dev/null || true

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'bella_music_temp_keychain' }}
        run: |
          # Rutas temporales
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decodificar certificado y perfil desde GitHub Secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Crear llavero temporal seguro
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Importar certificado al llavero
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Instalar perfil de aprovisionamiento
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Configure Team ID in ExportOptions.plist
        run: |
          sed -i '' "s/APPLE_TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/g" ios/ExportOptions.plist

      - name: Get Dependencies & Install Pods
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA (Release)
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi
          
          echo "Compilando Bella Music IPA con Build Number: $BUILD_NUM..."
          flutter build ipa --release \
            --build-number="$BUILD_NUM" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA to Apple TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          # Configurar la clave privada de App Store Connect para xcrun altool
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No se encontró ningún archivo .ipa generado."
            exit 1
          fi

          echo "🚀 Subiendo $IPA_PATH a App Store Connect / TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

          echo "✅ ¡Subida a TestFlight completada con éxito! Apple procesará el binario en minutos."

      - name: Upload IPA as GitHub Artifact (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BellaMusic-iOS-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Clean up Keychain & Certificates
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/* 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys 2>/dev/null || true
